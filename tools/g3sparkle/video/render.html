<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#FBF6EA;font-family:Poppins,'Noto Color Emoji',sans-serif;color:#2A0A4A}
#hd{position:absolute;left:0;top:0;width:1280px;height:92px;background:#0E1C42;color:#fff;display:flex;align-items:center;padding:0 40px;gap:18px;border-bottom:6px solid #C7922C}
#hd .k{font:600 20px Poppins;color:#F3D58A;letter-spacing:.12em;text-transform:uppercase}
#hd .t{font:italic 700 38px Lora,serif}
#hd .s{font:500 22px Poppins;color:#C9D3EE;margin-left:auto}
#opti{position:absolute;left:34px;bottom:96px;width:230px}
#opti img{width:230px;display:block;filter:drop-shadow(0 8px 10px rgba(14,28,66,.25))}
#ring{position:absolute;left:62px;bottom:92px;width:175px;height:26px;border-radius:50%;background:radial-gradient(ellipse,rgba(199,146,44,.55),rgba(199,146,44,0) 70%)}
#stage{position:absolute;left:300px;top:112px;width:950px;height:500px}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.scene.words{flex-direction:row;flex-wrap:wrap;align-content:center;gap:20px 22px}
.scene.words .lab,.scene.words .ask,.scene.words .say{flex-basis:100%;text-align:center}
.scene.cols{flex-direction:row;flex-wrap:wrap;align-content:center;gap:22px}
.scene.cols .lab,.scene.cols .pill{flex-basis:auto}
.scene.cols .lab{flex-basis:100%;text-align:center}
.scene.words .wd{font-size:40px;padding:12px 22px}
.it{will-change:opacity,transform}
.lab{font:700 30px Poppins;color:#6B4FA0}
.wd{display:inline-block;background:#fff;border:3px solid #D9CBEF;border-radius:18px;padding:14px 26px;font:700 46px Poppins;color:#2A0A4A;box-shadow:0 5px 0 #E6DCF5}
.wd .pt{color:inherit;transition:none;border-radius:8px;padding:0 2px}
.on .pt,.pt.on{background:#FFE08A;color:#7A4B00}
.dots .pt::before{content:'·';color:#C7922C;margin:0 2px}
.ask{font:600 34px Poppins;color:#2A0A4A;background:#F1E9FF;border-radius:16px;padding:12px 26px}
.say{font:500 34px Poppins;line-height:1.35;text-align:center;max-width:900px}
.say u{text-decoration-color:#C7922C;text-decoration-thickness:5px;text-underline-offset:6px}
.big{font-size:84px}
.huge{font:700 96px Poppins;color:#2A0A4A}
.gold{color:#B07A12;background:#FFE08A;border-radius:12px;padding:0 10px}
.pill{display:inline-block;background:#5B3E96;color:#fff;font:700 32px Poppins;border-radius:999px;padding:14px 34px;box-shadow:0 6px 0 #3D2770}
.boxes{display:flex;gap:18px}
.blank{display:inline-block;width:110px;height:46px;border-bottom:5px solid #C7922C;vertical-align:middle;margin-left:4px}
.quote{font:italic 600 40px Lora,serif;background:#fff;border-left:10px solid #C7922C;border-radius:14px;padding:22px 34px;max-width:920px;line-height:1.4;box-shadow:0 6px 18px rgba(42,10,74,.08)}
.quote small{display:block;font:500 20px Poppins;color:#8A7AA8;margin-top:6px;font-style:normal}
.quote.mine{border-left-color:#5B3E96}
.hl{background:#FFE08A;border-radius:8px;padding:0 6px;font-style:normal}
.q2{font-size:36px}.q2 .h1,.q2 .h2{border-radius:10px;padding:2px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}.q2 .jw{color:#B07A12;font-style:normal;font-weight:700}
.q2 .h1.on{outline:4px solid #4C8BD8;background:#E5F0FF}
.q2 .h2.on{outline:4px solid #4CA86B;background:#E6F6EA}
.parts{display:flex;gap:16px;align-items:center}
.slot{font:600 26px Poppins;color:#8A7AA8;border:3px dashed #C9B8E6;border-radius:14px;padding:16px 20px}
.def{display:flex;flex-direction:column;align-items:center;background:#fff;border:4px solid #C7922C;border-radius:22px;padding:22px 44px}
.def b{font:700 54px Poppins}.def span{font:500 32px Poppins}
.eq{display:flex;gap:14px;align-items:center}
.th{background:#E5F0FF;border:3px solid #4C8BD8;border-radius:16px;padding:18px 22px;font:700 30px Poppins;color:#1D4E8F}
.glue{font:700 30px Poppins;color:#B07A12}
.chips{display:flex;gap:18px}.chips span{background:#FFE08A;border-radius:14px;padding:10px 30px;font:700 40px Poppins;color:#7A4B00}
.col{width:280px;height:200px;background:#fff;border:3px solid #D9CBEF;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:22px;font:700 28px Poppins;text-align:center}
.col small{font:500 22px Poppins;color:#8A7AA8;margin-top:16px}
.bins{display:flex;gap:30px}.bins span{width:330px;height:150px;border:4px dashed #C9B8E6;border-radius:20px;display:flex;align-items:center;justify-content:center;font:700 32px Poppins;background:#fff}
.steps{display:flex;gap:24px}.steps span{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #D9CBEF;border-radius:999px;padding:12px 28px 12px 12px;font:700 32px Poppins}
.steps i,.step1 i{font-style:normal;background:#5B3E96;color:#fff;border-radius:50%;width:52px;height:52px;display:inline-flex;align-items:center;justify-content:center}
.step1{display:flex;align-items:center;gap:16px;font:700 40px Poppins;color:#5B3E96}
.swap{font:700 50px Poppins}.swap s{color:#9C8DB8;text-decoration-thickness:4px}.swap b{color:#B07A12}
.tile{display:inline-block;background:#fff;border:3px solid #D9CBEF;border-radius:16px;padding:12px 24px;font:700 34px Poppins;color:#2A0A4A;box-shadow:0 5px 0 #E6DCF5}
.tile.m{background:#F7F2FF;font-weight:500;color:#5B3E96}
.tile.key{background:#FFE08A;border-color:#C7922C;color:#7A4B00}
.tile i{font-style:normal;background:#5B3E96;color:#fff;border-radius:50%;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;font-size:24px}
.tile i.blank{background:none;border-radius:0;width:150px;height:40px;border-bottom:5px solid #C7922C;margin:0;display:inline-block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px}
.row4{display:flex;gap:16px}.row4 .tile{width:140px;text-align:center;color:#C9B8E6}.row4 .on2{border-color:#C7922C;background:#FFF4D2;color:#C7922C}
.build{display:flex;gap:16px;align-items:center;font:700 40px Poppins;color:#8A7AA8}
.bubble{position:relative;background:#fff;border:4px solid #8A5A2B;border-radius:26px;padding:22px 32px;font:600 36px Lora,serif;max-width:900px}
.bubble b:first-child{font:700 26px Poppins;color:#8A5A2B;display:block}
.wd.on{background:#FFF4D2;border-color:#C7922C;box-shadow:0 5px 0 #E8C97A}
.q3{font-size:38px}.q3 .hw.on{background:#FFE08A;border-radius:6px}
.cm{color:#C7922C;font-weight:900;opacity:0;font-style:normal}.cm.on{opacity:1;font-size:1.3em}
.bad{color:#B00020;font-weight:900;font-style:normal}.bad.on{background:#FFD6DC;border-radius:6px;padding:0 6px;font-size:1.3em}
.good{border-left-color:#4CA86B}
.dots6{font-size:40px;letter-spacing:10px;color:#C7922C}
.t1.on,.t2.on,.t3.on{background:#FFE08A;border-radius:6px;padding:0 4px}
#cap{position:absolute;left:300px;right:40px;bottom:20px;min-height:62px;line-height:1.3;padding:8px 24px;display:flex;align-items:center;justify-content:center;text-align:center;font:500 25px Poppins;color:#fff;background:rgba(14,28,66,.88);border-radius:16px}
#bar{position:absolute;left:0;bottom:0;height:6px;background:#C7922C}
</style></head><body>
<div id="hd"><span class="k">Opti shows you</span><span class="t" id="ttl"></span><span class="s" id="sub"></span></div>
<div id="ring"></div><div id="opti"><img id="oimg"></div>
<div id="stage"></div><div id="cap"></div><div id="bar"></div>
<script>
let TL, SC = [];
function setup(tl, owl) {
  TL = tl; document.getElementById('oimg').src = 'data:image/png;base64,' + owl;
  document.getElementById('ttl').textContent = tl.title; document.getElementById('sub').textContent = tl.sub;
  const st = document.getElementById('stage');
  tl.scenes.forEach(s => {
    const d = document.createElement('div'); d.className = 'scene ' + (s.layout || '');
    s.items.forEach(it => { const w = document.createElement('div'); w.className = 'it'; w.style.display = 'contents'; const tmp = document.createElement('div'); tmp.innerHTML = it.html; const el = tmp.firstElementChild; el.classList.add('it'); el.dataset.t = it.t; d.appendChild(el); });
    st.appendChild(d); SC.push({ el: d, s });
  });
}
const clamp = x => Math.max(0, Math.min(1, x));
function speaking(t) { return !TL.sil.some(([a, b]) => t >= a && t <= b) && t < TL.dur - 0.2; }
function render(t) {
  let cur = 0; SC.forEach((x, i) => { if (t >= x.s.t) cur = i; });
  SC.forEach((x, i) => {
    const op = i === cur ? clamp((t - x.s.t) / 0.35) : 0;
    x.el.style.opacity = op; x.el.style.visibility = op ? 'visible' : 'hidden';
    x.el.querySelectorAll('.it').forEach(e => { const a = clamp((t - (+e.dataset.t)) / 0.3); e.style.opacity = a; e.style.transform = 'translateY(' + ((1 - a) * 14) + 'px)'; });
    const hon=new Map(); (x.s.hl || []).forEach(h => x.el.querySelectorAll(h.sel).forEach(e => hon.set(e, (hon.get(e)||false) || t >= h.t))); hon.forEach((v,e)=>e.classList.toggle('on', v));
    if (x.s.dots != null) x.el.classList.toggle('dots', t >= x.s.dots);
  });
  let c = ''; TL.caps.forEach(k => { if (t >= k.t) c = k.text; }); document.getElementById('cap').textContent = c;
  const talk = speaking(t);
  document.getElementById('opti').style.transform = 'translateY(' + (Math.sin(t * 2.2) * 5 - (talk ? 3 : 0)) + 'px) rotate(' + (talk ? Math.sin(t * 7) * 1.2 : 0) + 'deg)';
  document.getElementById('ring').style.opacity = talk ? 0.6 + 0.4 * Math.abs(Math.sin(t * 6)) : 0.25;
  document.getElementById('bar').style.width = (1280 * clamp(t / TL.dur)) + 'px';
}
</script></body></html>
